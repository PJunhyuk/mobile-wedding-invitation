# GitHub Pages 배포: main 에 푸시하면 검사(npm run check)를 통과한 빌드를 올립니다.
# 저장소 Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 두어야 동작합니다.
# 프로젝트 사이트(https://<계정>.github.io/<저장소>/)의 하위 경로와 주소는 configure-pages 가 알려 주는 값으로 빌드합니다.
# 커스텀 도메인을 연결하면 base_path 가 비어 루트(/)로 빌드됩니다. 쓰지 않으면 이 파일을 지우세요.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# 진행 중인 배포는 취소하지 않습니다 — 반쯤 올라간 채 끊기지 않게 (GitHub 의 Pages 템플릿과 같은 설정)
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      # check 의 마지막 단계가 빌드이므로, 배포 위치를 환경변수로 주면 그 결과(dist/)를 그대로 올립니다
      - run: npm run check
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
